lang: es
bibliography: referencias.bib
link-citations: true
slide-level: 2
callout-icon: false
execute:
  enabled: false
format:
  revealjs:
    theme:
    - default
    - estilos/reveal.scss
    width: 1600
    height: 900
    margin: 0.06
    center: false
    transition: fade
    background-transition: fade
    slide-number: c/t
    hash: true
    history: true
    controls: true
    progress: true
    navigation-mode: linear
    code-copy: true
    code-line-numbers: false
    footer: '[BioForja](https://pablocaicedor.github.io/)'
    html-math-method: katex
    embed-resources: true
    slide-tone: false
  beamer:
    aspectratio: 169
    theme: Madrid
    colortheme: dolphin
    fonttheme: professionalfonts
    navigation: empty
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: estilos/beamer-header.tex
    toc: false
    fontsize: 10pt
    mainfont: DejaVu Sans
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    latex-min-runs: 2
filters:
- estilos/beamer-callouts.lua
- quarto
