[project]
name = "ictus-semg"
version = "0.1.0"
description = "Tablero interactivo de sEMG en ictus (SBVI) con Streamlit y Plotly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=6.0",
    "scipy>=1.14",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
