<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">BioForja logo</title>
  <desc id="desc">Logo vectorial de BioForja con símbolo biomédico, red causal y acento de forja sobre fondo transparente.</desc>

  <defs>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38E8FF"/>
      <stop offset="55%" stop-color="#00A7C7"/>
      <stop offset="100%" stop-color="#04718A"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="55%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2533"/>
      <stop offset="100%" stop-color="#061722"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001018" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Transparent background intentionally left empty -->

  <!-- Icon group -->
  <g id="bioforja-mark" transform="translate(92 54)" filter="url(#subtleShadow)">
    <!-- Outer hexagonal forge/biotech container -->
    <path d="M186 0 L346 92 L346 276 L186 368 L26 276 L26 92 Z"
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M186 32 L318 108 L318 260 L186 336 L54 260 L54 108 Z"
          fill="url(#darkGrad)" opacity="0.95"/>

    <!-- Inner geometric layer -->
    <path d="M186 58 L293 120 L293 244 L186 306 L79 244 L79 120 Z"
          fill="none" stroke="#123C4A" stroke-width="4" opacity="0.9"/>

    <!-- Causal/data network -->
    <g stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
      <path d="M116 126 C154 88, 212 88, 248 128" fill="none" stroke="url(#cyanGrad)" stroke-width="6"/>
      <path d="M118 242 C154 284, 221 284, 260 238" fill="none" stroke="url(#cyanGrad)" stroke-width="6"/>
      <path d="M116 126 L144 190 L118 242" fill="none" stroke="#3ADCF0" stroke-width="5" opacity="0.85"/>
      <path d="M248 128 L226 190 L260 238" fill="none" stroke="#3ADCF0" stroke-width="5" opacity="0.85"/>
      <path d="M144 190 H226" fill="none" stroke="#F4A261" stroke-width="6"/>
      <path d="M178 144 C205 154, 205 225, 178 236" fill="none" stroke="#F4A261" stroke-width="8"/>
    </g>

    <!-- Biomedical waveform through the mark -->
    <path d="M76 205 H116 L129 178 L151 246 L177 126 L201 251 L220 205 H296"
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

    <!-- Nodes -->
    <g filter="url(#softGlow)">
      <circle cx="116" cy="126" r="11" fill="#071923" stroke="#38E8FF" stroke-width="5"/>
      <circle cx="248" cy="128" r="11" fill="#071923" stroke="#38E8FF" stroke-width="5"/>
      <circle cx="144" cy="190" r="10" fill="#071923" stroke="#FFD166" stroke-width="5"/>
      <circle cx="226" cy="190" r="10" fill="#071923" stroke="#FFD166" stroke-width="5"/>
      <circle cx="118" cy="242" r="11" fill="#071923" stroke="#38E8FF" stroke-width="5"/>
      <circle cx="260" cy="238" r="11" fill="#071923" stroke="#38E8FF" stroke-width="5"/>
      <circle cx="186" cy="190" r="18" fill="url(#goldGrad)"/>
    </g>

    <!-- Forge sparks -->
    <g stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M186 48 V24"/>
      <path d="M232 66 L246 42"/>
      <path d="M140 66 L126 42"/>
      <path d="M302 184 H326"/>
      <path d="M46 184 H70"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g id="bioforja-wordmark" transform="translate(520 128)">
    <text x="0" y="120"
          font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="132" font-weight="800" letter-spacing="-4">
      <tspan fill="#E8FBFF">Bio</tspan><tspan fill="url(#goldGrad)">Forja</tspan>
    </text>

    <path d="M6 170 H650" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M6 170 H190" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

    <text x="4" y="224"
          font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="500" letter-spacing="3.5"
          fill="#9FD9E6">
      BIOMEDICAL AI · SIGNALS · IMAGING · CAUSALITY
    </text>
  </g>
</svg>
